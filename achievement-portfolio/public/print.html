<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>كشف الدرجات</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <a class="brand" href="/admin"><span class="brand-mark" data-icon="book"></span><span>كشف الدرجات</span></a>
        <div class="spacer"></div>
        <button class="btn btn-ghost icon-btn" data-theme-toggle type="button"></button>
      </div>
    </header>
    <main class="container">
      <div class="print-toolbar">
        <label class="sr-only" for="cls">الفصل</label>
        <select id="cls" class="input"></select>
        <button class="btn btn-primary" id="printBtn" type="button" data-icon="printer"><span>طباعة / حفظ PDF</span></button>
        <a class="btn btn-gold" id="excelBtn" href="#" data-icon="sheet"><span>تصدير Excel</span></a>
        <a class="btn btn-ghost" href="/admin">رجوع للوحة</a>
      </div>
      <div id="sheets"><div class="loading-state"><div class="spinner"></div><span>جارٍ تجهيز الكشف…</span></div></div>
    </main>
    <script src="/js/common.js"></script>
    <script src="/js/print.js"></script>
  </body>
</html>
