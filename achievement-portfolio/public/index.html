<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ملف الإنجاز — اختر اسمك</title>
    <script src="/js/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <a class="brand" href="/"><span class="brand-mark" data-icon="book"></span><span>ملف الإنجاز الإلكتروني</span></a>
        <div class="spacer"></div>
        <button class="btn btn-ghost icon-btn" data-theme-toggle type="button"></button>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>أهلًا بك في <em>ملف الإنجاز</em></h1>
        <p>اختر اسمك من القائمة لعرض أعمالك ورفعها ومتابعة درجاتك.</p>
      </section>

      <div class="picker">
        <div id="resume" class="notice ok" hidden></div>

        <label class="search">
          <span class="sr-only">ابحث عن اسمك</span>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
          <input id="q" class="input" type="search" placeholder="ابحث عن اسمك…" autocomplete="off" />
        </label>

        <div id="list" aria-live="polite">
          <div class="loading-state"><div class="spinner"></div><span>جارٍ تحميل الأسماء…</span></div>
        </div>

        <p class="staff-link"><a class="btn btn-ghost btn-sm" href="/admin" data-icon="lock">دخول المعلم / المدير</a></p>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/picker.js"></script>
  </body>
</html>
