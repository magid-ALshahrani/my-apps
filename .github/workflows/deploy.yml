name: اختبار ونشر التطبيق

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            health-register/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # سجل الموجه الصحي: يُبنى ويُنشر تحت /health/ بجانب صندوق الإخوة
      - name: سجل الموجه الصحي — تثبيت واختبار وبناء
        working-directory: health-register
        env:
          VITE_BASE: /my-apps/health/
          # المفتاح العام (publishable) مصمم ليكون داخل الواجهة؛ الحماية في RLS
          VITE_SUPABASE_URL: https://aafjvmlhsrlcxhbzxdic.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.HEALTH_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm test
          npm run build
          rm -rf ../app/dist/health
          cp -r dist ../app/dist/health
          cp public/404.html ../app/dist/404.html
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
